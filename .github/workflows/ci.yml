name: 🔍 CI – Lint & Dependency Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-check:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black

      - name: 🖤 Check code formatting with Black
        run: black --check --diff .

      - name: 🔎 Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (max line length 120, exit-zero so it doesn't fail CI)
          flake8 . --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics \
            --exclude=.venv,chroma_db,uploads,__pycache__

      - name: 🔐 Check for hardcoded secrets (basic)
        run: |
          echo "Checking for potential hardcoded secrets..."
          ! grep -rn "GROQ_API_KEY\s*=\s*['\"][a-zA-Z0-9]" . \
            --include="*.py" \
            --exclude-dir=".venv" \
            --exclude-dir="__pycache__" \
            && echo "✅ No hardcoded API keys found."

  import-check:
    name: Import & Startup Check
    runs-on: ubuntu-latest
    needs: lint-and-check

    env:
      GROQ_API_KEY: dummy_key_for_ci_import_check

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Verify all modules can be imported
        run: |
          python -c "
          import db.db
          import model.model
          import rag.rag
          import reranker.reranker
          import retriever.retriever
          import upload.upload
          import query.query
          print('✅ All modules imported successfully.')
          "
